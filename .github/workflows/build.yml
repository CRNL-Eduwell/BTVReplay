name: Build BTVReplay

# Builds the three desktop targets and attaches them to the GitHub Release when a release is
# published -- the develop -> master version flow ends by publishing the VX.Y.Z release -- plus
# on demand. Uses a free Unity *Personal* licence activated from account credentials (no Pro/Plus
# serial); see .github/workflows/README.md for the required secrets and the per-platform matrix.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag (e.g. V4.3.0) to build and attach the archives to. Leave empty for artifacts only.'
        required: false
        default: ''
      targets:
        description: 'Platforms to build: all, or a comma-separated list of linux, windows, macos (e.g. "linux,windows" skips the macOS job).'
        required: false
        default: 'all'

permissions:
  contents: write   # the "Attach to release" step uploads assets to the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # one build script works on all three runners (bash ships on windows-latest)

jobs:
  # Turns the `targets` input into the build matrix, so a manual run can leave a platform out
  # (macOS minutes cost the most). A release event has no inputs and builds all three.
  targets:
    name: Pick targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick targets
        id: pick
        env:
          TARGETS: ${{ github.event.inputs.targets || 'all' }}
        # Each target builds on its OWN native runner. Building all three from one host
        # (as DefaultBuild does locally) needs cross-platform IL2CPP toolchains that aren't
        # available, so we fan out instead. macos-latest is Apple Silicon, so its .app is a
        # real arm64 build and this project's arm64-only native plugins load correctly.
        #   module    = unity-setup build-target / module to install
        #   cliTarget = Unity's own -buildTarget switch value
        run: |
          set -euo pipefail
          all='[
            {"key":"linux",   "name":"Linux",         "os":"ubuntu-latest",  "module":"StandaloneLinux64",   "cliTarget":"Linux64",      "artifact":"BTVReplay-Linux"},
            {"key":"windows", "name":"Windows",       "os":"windows-latest", "module":"StandaloneWindows64", "cliTarget":"Win64",        "artifact":"BTVReplay-Windows"},
            {"key":"macos",   "name":"macOS (arm64)", "os":"macos-latest",   "module":"StandaloneOSX",       "cliTarget":"OSXUniversal", "artifact":"BTVReplay-macOS-arm64"}
          ]'
          wanted=$(printf '%s' "$TARGETS" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [ "$wanted" = "all" ]; then
            matrix=$(jq -c . <<<"$all")
          else
            # An unknown name or an empty list fails the run here, before any runner is spent.
            matrix=$(jq -c --arg wanted "$wanted" '
              ($wanted | split(",") | map(select(. != ""))) as $w
              | ($w - map(.key)) as $unknown
              | if ($unknown | length) > 0 then error("unknown target: " + ($unknown | join(", ")) + " (use all, or a list of linux, windows, macos)")
                elif ($w | length) == 0 then error("no target given (use all, or a list of linux, windows, macos)")
                else map(select(.key as $k | $w | index($k)))
                end' <<<"$all")
          fi
          echo "Building: $(jq -r 'map(.name) | join(", ")' <<<"$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: targets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one target failing must not cancel the others
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A manual run for an existing release builds exactly that tag.
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      # The Library import cache is the big time saver; the first run per target is a full
      # asset import (~slow), later runs reuse it. Keyed on the assets so it invalidates
      # when they change, with progressively looser restore-keys for a warm-ish start.
      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ matrix.module }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.module }}-
            Library-

      # unity-setup v3 installs the editor with Unity's official CLI; no Unity Hub is installed
      # (v2 drove the Hub, and the Linux job had to pin Hub 3.19.5 to be found). The editor
      # download can still fail for a passing reason: under v2 the 4.3.0 Windows job timed out
      # after ~8 min and the same install went through when retried on the same runner. So one
      # attempt may fail and a second one runs; the job only fails if both do. (Known upstream
      # wart, still in v3: after a failed attempt, unity-setup's post-step re-runs the whole
      # setup at the end of the job.)
      - name: Install Unity
        id: unity-setup
        continue-on-error: true
        uses: RageAgainstThePixel/unity-setup@v3
        with:
          unity-version: 6000.4.10f1   # keep in sync with ProjectSettings; re-pin on editor upgrade
          build-targets: ${{ matrix.module }}

      - name: Install Unity (retry)
        if: steps.unity-setup.outcome == 'failure'
        uses: RageAgainstThePixel/unity-setup@v3
        with:
          unity-version: 6000.4.10f1   # same inputs as above
          build-targets: ${{ matrix.module }}

      # Activates a free Personal licence straight from the account credentials. This replaces
      # the dead manual .alf -> .ulf web flow (Unity removed Personal from that page). v3 goes
      # with unity-setup v3: v2 looked for the licensing client inside a Unity Hub install,
      # which is no longer there. Its post-step returns the licence at the end of the Windows
      # job only: GitHub's Linux and macOS runners each share one machine identity with Unity,
      # so a return there would revoke the licence of every other job on that identity.
      - name: Activate Unity licence (Personal)
        uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      # -buildTarget switches the active platform so plugin import settings + defines resolve
      # correctly; BTVReplayBuilder.Build then builds that active target and copies Assets/Config
      # and the per-platform natives next to the player (same path as Tools -> Build BTVReplay).
      # It calls EditorApplication.Exit(1) on failure, so a broken build fails this job.
      - name: Build ${{ matrix.cliTarget }}
        run: |
          set -euo pipefail
          "$UNITY_EDITOR_PATH" \
            -batchmode -quit -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget ${{ matrix.cliTarget }} \
            -executeMethod BTVReplayBuilder.Build \
            -buildOutput "$GITHUB_WORKSPACE/build" \
            -logFile -

      # Package the build folder into one archive per platform. ditto preserves the macOS .app
      # bundle (symlinks, permissions, code signature); zip/7z handle the Linux/Windows folders.
      # The archive is named after the build folder, so it carries the version (BTVReplay.X.Y.Z.<os>).
      - name: Package build
        id: package
        run: |
          set -euo pipefail
          folder=$(ls -d build/*/ | head -1); folder=${folder%/}
          name=$(basename "$folder")
          zip="${name}.zip"
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --sequesterRsrc --keepParent "$folder" "$zip" ;;
            Linux)   ( cd build && zip -r -y -q "../$zip" "$name" ) ;;
            Windows) ( cd build && 7z a -tzip -bso0 "../$zip" "$name" ) ;;
          esac
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          ls -lh "$zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      # On a published release, or a manual run given release_tag, attach the archive to that
      # release (--clobber so re-runs replace the asset). A plain manual run only uploads artifacts.
      - name: Attach to release
        if: github.event_name == 'release' || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.zip }}" --clobber
