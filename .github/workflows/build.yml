name: Build BTVReplay

# Builds the three desktop targets when master is updated (i.e. on a develop -> master
# release merge), plus on demand. Requires the UNITY_LICENSE secret (see README.md).
on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one target failing must not cancel the others
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - StandaloneLinux64
          - StandaloneOSX
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.10f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: BTVReplay
          versioning: None        # use bundleVersion from ProjectSettings, not git tags
          allowDirtyBuild: true

      # The app loads Assets/Config at runtime; the player build does not include it, so copy
      # it next to the executable exactly like BTVReplayBuilder does in-editor.
      - name: Copy runtime Config into the build
        run: |
          set -euo pipefail
          BUILD_DIR="build/${{ matrix.targetPlatform }}"
          case "${{ matrix.targetPlatform }}" in
            StandaloneWindows64|StandaloneLinux64) DEST="$BUILD_DIR/BTVReplay_Data/Config" ;;
            StandaloneOSX)                         DEST="$BUILD_DIR/BTVReplay.app/Contents/Config" ;;
          esac
          echo "Copying Assets/Config -> $DEST"
          mkdir -p "$DEST"
          cp -R Assets/Config/. "$DEST/"
          find "$DEST" -name '*.meta' -delete

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BTVReplay-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          if-no-files-found: error
